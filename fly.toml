# Fly.io app config. The setup script (setup.cmd or setup.sh) fills in `app`, the region and the time zone, and sets
# the secrets; you don't need to edit this.
app = "my-magpie"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  HOUSEHOLD_TZ = "UTC"
  PORT = "8080"

[[mounts]]
  source = "tracker_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
