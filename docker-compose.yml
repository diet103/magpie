# Magpie on your own machine or home server, as an alternative to Fly.io. See docs/docker.md.
# Settings come from .env beside this file (copy .env.example). Data lives in the magpie_data volume.
services:
  magpie:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "8080"
    ports:
      # Only this machine can reach it directly. Put your HTTPS proxy or tunnel in front of port 8080.
      # If 8080 is taken, start it with another one: MAGPIE_PORT=8090 docker compose up -d
      - "127.0.0.1:${MAGPIE_PORT:-8080}:8080"
    volumes:
      - magpie_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  magpie_data:
