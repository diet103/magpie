name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read

jobs:
  deploy:
    # Only a push to this repository's own main branch deploys. A pull request, even one from a branch that is
    # also called main in someone's fork, must never reach the step that holds the Fly token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # A copy of this repository with no Fly token (a fork, or one that is deployed by hand) has nothing to do here.
      - id: ready
        run: if [ -n "$FLY_API_TOKEN" ]; then echo "yes=1" >> "$GITHUB_OUTPUT"; else echo "No FLY_API_TOKEN secret, so nothing is deployed."; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.ready.outputs.yes == '1'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.ready.outputs.yes == '1'
      - run: flyctl deploy --remote-only --ha=false
        if: steps.ready.outputs.yes == '1'
